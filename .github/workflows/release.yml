name: release

# Tag a version to cut a release:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release + upload assets

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build all platform binaries
        run: bash scripts/build-all.sh

      - name: Create GitHub release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mdpubs-darwin-arm64
            dist/mdpubs-darwin-x64
            dist/mdpubs-linux-x64
            dist/mdpubs-linux-arm64
            dist/mdpubs-*.sha256
          generate_release_notes: true
